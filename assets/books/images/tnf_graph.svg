<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
  <style>
    .node { fill: white; stroke: #333; stroke-width: 1.5; }
    .node-text { font-family: sans-serif; font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
    .edge-label { font-family: sans-serif; font-size: 11px; text-anchor: middle; fill: #444; }
    .edge-label-bg { fill: #d0d0d0; }
    .arrow { stroke: #333; stroke-width: 1.5; fill: none; }
    .arrowhead { fill: #333; }
  </style>

  <!-- TNF-0 -->
  <rect x="250" y="20" width="100" height="40" rx="4" class="node"/>
  <text x="300" y="40" class="node-text">TNF-0</text>

  <!-- Edge: TNF-0 to TNF-T -->
  <line x1="300" y1="60" x2="300" y2="130" class="arrow"/>
  <polygon points="300,130 295,120 305,120" class="arrowhead"/>
  <rect x="200" y="80" width="200" height="30" rx="4" class="edge-label-bg"/>
  <text x="300" y="95" class="edge-label">no dup keys, homogeneous arrays</text>

  <!-- TNF-T -->
  <rect x="250" y="130" width="100" height="40" rx="4" class="node"/>
  <text x="300" y="150" class="node-text">TNF-T</text>

  <!-- Edges from TNF-T -->
  <!-- To TNF-N -->
  <line x1="250" y1="170" x2="100" y2="260" class="arrow"/>
  <polygon points="100,260 102,248 112,254" class="arrowhead"/>
  <rect x="70" y="200" width="130" height="24" rx="4" class="edge-label-bg"/>
  <text x="135" y="212" class="edge-label">nesting = namespace</text>

  <!-- To TNF-G -->
  <line x1="300" y1="170" x2="300" y2="260" class="arrow"/>
  <polygon points="300,260 295,250 305,250" class="arrowhead"/>
  <rect x="220" y="200" width="130" height="24" rx="4" class="edge-label-bg"/>
  <text x="285" y="212" class="edge-label">nesting = grouping</text>

  <!-- To TNF-M -->
  <line x1="350" y1="170" x2="500" y2="260" class="arrow"/>
  <polygon points="500,260 488,254 498,248" class="arrowhead"/>
  <rect x="400" y="200" width="110" height="24" rx="4" class="edge-label-bg"/>
  <text x="455" y="212" class="edge-label">nesting = pivot</text>

  <!-- TNF-N -->
  <rect x="50" y="260" width="100" height="40" rx="4" class="node"/>
  <text x="100" y="280" class="node-text">TNF-N</text>

  <!-- TNF-G -->
  <rect x="250" y="260" width="100" height="40" rx="4" class="node"/>
  <text x="300" y="280" class="node-text">TNF-G</text>

  <!-- TNF-M -->
  <rect x="450" y="260" width="100" height="40" rx="4" class="node"/>
  <text x="500" y="280" class="node-text">TNF-M</text>

  <!-- Edges from TNF-G -->
  <!-- To TNF-SR -->
  <line x1="250" y1="300" x2="130" y2="390" class="arrow"/>
  <polygon points="130,390 132,378 142,384" class="arrowhead"/>
  <rect x="80" y="330" width="120" height="24" rx="4" class="edge-label-bg"/>
  <text x="140" y="342" class="edge-label">no nested groups</text>

  <!-- To TNF-R -->
  <line x1="300" y1="300" x2="300" y2="390" class="arrow"/>
  <polygon points="300,390 295,380 305,380" class="arrowhead"/>
  <rect x="195" y="330" width="160" height="24" rx="4" class="edge-label-bg"/>
  <text x="275" y="342" class="edge-label">single path, no siblings</text>

  <!-- To TNF-GN -->
  <line x1="350" y1="300" x2="470" y2="390" class="arrow"/>
  <polygon points="470,390 458,384 468,378" class="arrowhead"/>
  <rect x="380" y="330" width="140" height="24" rx="4" class="edge-label-bg"/>
  <text x="450" y="342" class="edge-label">+ namespaced leaves</text>

  <!-- TNF-SR -->
  <rect x="80" y="390" width="100" height="40" rx="4" class="node"/>
  <text x="130" y="410" class="node-text">TNF-SR</text>

  <!-- TNF-R -->
  <rect x="250" y="390" width="100" height="40" rx="4" class="node"/>
  <text x="300" y="410" class="node-text">TNF-R</text>

  <!-- TNF-GN -->
  <rect x="420" y="390" width="100" height="40" rx="4" class="node"/>
  <text x="470" y="410" class="node-text">TNF-GN</text>
</svg>
