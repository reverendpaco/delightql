[workspace]
resolver = "2"
exclude = ["devtools/fn-lengths"]
# delightql-duckdb is NOT a default member: cargo's per-invocation
# feature unification would otherwise link libduckdb (backends/duckdb)
# into every binary built alongside it — including dql itself, which
# must stay duckdb-free unless its own feature asks. Build the duckdb
# fatboy explicitly: `cargo build -p delightql-duckdb`.
default-members = [
    "crates/delightql-buildinfo",
    "crates/delightql-core",
    "crates/delightql-cli",
    "crates/delightql-formatter",
    "crates/delightql-macros",
    "crates/delightql-postgres", "crates/delightql-backends", "crates/delightql-types",
    "crates/delightql-wasm",
    "crates/delightql-cli-siso",
    "crates/delightql-protocol",
    "crates/delightql-sqlite-relay",
    "crates/dql-test-ball-runner",
    "crates/delightql-cabi",
]
# delightql-cst is a member but NOT a default member: its build script runs the
# pinned tree-sitter CLI, so building it requires that CLI on PATH. Build it
# explicitly: `cargo build -p delightql-cst`.
members = [
    "crates/delightql-buildinfo",
    "crates/delightql-core",
    "crates/delightql-cst",
    "crates/delightql-cli",
    "crates/delightql-formatter",
    "crates/delightql-macros",
    "crates/delightql-postgres", "crates/delightql-duckdb", "crates/delightql-backends", "crates/delightql-types",
    "crates/delightql-wasm",
    "crates/delightql-cli-siso",
    "crates/delightql-protocol",
    "crates/delightql-sqlite-relay",
    "crates/dql-test-ball-runner",
    "crates/delightql-cabi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Daniel Eklund"]
license = "MIT"
repository = "https://github.com/username/delightql"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"

# Databases
rusqlite = { version = "0.40", features = ["bundled", "column_decltype", "serialize", "hooks", "fallible_uint"] }

# Tree-sitter: ONE exact upstream family. The generator CLI (Makefile pin),
# the runtime, the highlighter and the language crate are one tuple; a
# semver range here could let any of them drift from the others. On
# wasm32-unknown-unknown the runtime supplies C allocation from Rust's
# global allocator and its own libc subset, so no sysroot and no second
# allocator are linked.
tree-sitter = "=0.27.0"
tree-sitter-highlight = "=0.27.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Compression
zstd = "0.13"

# Dev dependencies


tempfile = "3.8"

# Full DWARF costs generation time, link time, and target/ size for a debugger
# this workflow does not run. Line tables keep file:line in panic backtraces;
# variable and type inspection is what is given up.
[profile.dev]
debug = "line-tables-only"

# Dependencies rarely recompile, so optimizing them costs nothing per edit,
# while the test suite, which runs this dev binary, spends much of its time in
# them (bundled SQLite among them). "*" covers only non-workspace packages, so
# delightql-cst, the workspace crate that compiles the grammar's C parser, is
# named separately; it recompiles only when it or the grammar changes.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.delightql-cst]
opt-level = 3

# Custom profile: optimize for maximum speed
[profile.release-fast]
inherits = "release"
opt-level = 3
lto = "fat"


[profile.release-ship]
inherits    = "release"
opt-level   = 3          # fast — keep it
lto         = "fat"      # faster AND smaller, costs only build time
strip       = "symbols"  # ~8 MB gone, no runtime cost
# panic stays "unwind"   # safe for server + cabi + wasm

# Custom profile: optimize for minimum size
[profile.release-size]
inherits = "release"
opt-level = "z"

# Custom profile: optimize for size with aggressive settings
[profile.release-tiny]
inherits = "release"
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"  # Removes panic formatting code
