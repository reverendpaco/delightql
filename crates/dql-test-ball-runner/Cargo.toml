[package]
name = "dql-test-ball-runner"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dql-test-ball-runner"
path = "src/main.rs"

[dependencies]
delightql-buildinfo = { path = "../delightql-buildinfo" }
delightql-protocol = { path = "../delightql-protocol" }
# The statement splitter. The runner divides a submission with core's own
# `split_queries`, the one the CLI and the C ABI use; a second splitter here
# would be a second answer.
delightql-core = { path = "../delightql-core" }
# The prompt wrap: a test's statement is what a user typed at a prompt, and
# the host that sends it writes the goal marker.
delightql-cst = { path = "../delightql-cst" }
clap.workspace = true
rusqlite.workspace = true
zstd.workspace = true
