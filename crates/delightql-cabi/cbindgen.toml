language = "C"
include_guard = "DELIGHTQL_H"
autogen_warning = "/* Auto-generated by cbindgen. Do not edit. */"
include_version = true
braces = "SameLine"
tab_width = 4
style = "Both"

[defines]
"target_os = windows" = "DQL_WINDOWS"

[export]
include = [
    "DqlQueryResult",
    "DqlFetchResult",
    "DqlColumnInfo",
    "DqlCell",
    "DqlSplitResult",
]

[export.rename]
"DqlCabiHandle" = "dql_handle_t"

[fn]
rename_args = "SnakeCase"

[struct]
rename_fields = "SnakeCase"
