[package]
name = "delightql-formatter"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# The source formatter. Its substrate is the typed CST, so it links the one
# consolidated language through `delightql-cst` and compiles no parser of its
# own.

[lib]
path = "src/lib.rs"

[[bin]]
name = "dql-fmt"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:clap"]

[dependencies]
delightql-cst = { path = "../delightql-cst" }
tree-sitter.workspace = true
anyhow.workspace = true
clap = { workspace = true, optional = true }
