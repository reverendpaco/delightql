# DelightQL mise configuration
# Tasks for building and running DelightQL components.
#
# BOUNDARY NOTE: this file ships with the public impl repo (see
# export.toml / export-mission.md). Tasks here may only reference paths
# that exist in the public tree. Tasks touching private paths
# (new_test_suite/, scripts/, lightweight_webserver/, lua/, config/, …)
# or personal machine paths live in mise.local.toml (committed, never
# exported, read automatically by mise).

# Tool requirements
# Note: tree-sitter CLI is managed via Makefile (cargo install from git)
# Run `make ensure-tree-sitter` to install the version pinned to Cargo.toml
[tools]
rust = "1.90"
node = "latest"
bats = "latest"

[tasks.build-node]
description = "Build Node.js binding (koffi + C-ABI)"
run = "make -C ./hosts/node"

[tasks.build-python-wheel]
description = "Maturin builds dynlib and wraps in wheel"
run = "make -C ./hosts/python"

[tasks.launch-python-repl]
depends = ["build-python-wheel"]
run = """
uv venv --quiet /tmp/dql-repl
uv pip install --quiet --python /tmp/dql-repl hosts/python/dist/*.whl
/tmp/dql-repl/bin/python || true
rm -rf /tmp/dql-repl
"""

[tasks.build-rust-bins-debug]
description = "Build the binaries: dql, dql-test-ball-runner and dql-fmt"
run = """
set -e
cargo build --bin dql --bin dql-test-ball-runner --bin dql-fmt --features="bundled-parser"
# Gate the build on self-diagnostics: a broken autoload (or other provider
# failure) fails the build here rather than surfacing later as a misleading
# `Table not found`. See DIAGNOSTICS-DESIGN.md.
./target/debug/dql selftest
"""

[tasks.build-rust-bins-release-tiny]
description = "Build the binaries: dql, dql-test-ball-runner and dql-fmt"
run = """
cargo build --bin dql --bin dql-test-ball-runner --bin dql-fmt --features="bundled-parser" --profile release-tiny
"""

[tasks.build-nvim-ts]
description = "Build treesitter dynlib for IDEs (run grammar generation first)"
run = """
cd grammar_dql
cc -o delightql_v2.so -I./src src/parser.c -shared -Os -lstdc++ -fPIC
"""

# Env variables
[env]
RUST_BACKTRACE = "1"
MISE_ACTIVATE_AGGRESSIVE = "1"
_.path = ["./scripts", "./target/debug", "."]
# DuckDB support - downloads to .mise/libs/
# Run `mise run setup-libs` first if you need DuckDB
# NOTE: Tree-sitter link order is handled by build-cli task
# Runtime library path is set via rpath in build.rs
